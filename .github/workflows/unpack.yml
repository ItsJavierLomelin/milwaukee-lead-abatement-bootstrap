name: unpack
on:
  workflow_dispatch:
  push:
    paths:
      - '1-payload.tgz'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar xzf 1-payload.tgz
          rm 1-payload.tgz
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Milwaukee Lead Abatement Pros Bootstrap site"
          git push
