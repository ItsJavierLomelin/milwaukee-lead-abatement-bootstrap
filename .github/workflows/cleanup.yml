name: One-time wording cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cleanup.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean wording
        run: |
          set -e
          FILES=$(grep -rlE 'Illustrative|illustrative|dummy|review preview' --include='*.html' --include='pages.json' . --exclude-dir=vendor --exclude-dir=.git || true)
          echo "$FILES"
          for f in $FILES; do
          sed -i -e 's/; stock images are illustrative, not completed projects//g' -e 's/ *Stock images are illustrative, not completed projects\.//g' -e 's/ *Review preview with a dummy phone number\.//g' -e 's/ *This is a review preview\.//g' -e 's/, not an\? [A-Za-z -]* project photo//g' -e 's/Illustrative \(.\)/\u\1/g' "$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo nothing; else git commit -m 'Remove illustrative wording'; git push; fi
